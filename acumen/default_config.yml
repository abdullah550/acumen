# Acumen default configuration.
# Do not edit this file. Put overrides in ./config.yml (same structure, only the keys you change).

app:
  name: Acumen
  account_currency: PKR        # PKR or USD, the currency position sizes are shown in
  default_equity: 1000000      # starting equity used for sizing until you change it in the app
  usd_pkr_fallback: 283.0      # only used when no live USD/PKR rate could be fetched
  contact: ""                  # goes into the User-Agent so data providers can reach you (or env ACUMEN_CONTACT)

# ---------------------------------------------------------------- horizons
horizons:
  short:  {label: Swing,       min_days: 3,  max_days: 25,  time_stop_bars: 20}
  medium: {label: Positional,  min_days: 15, max_days: 100, time_stop_bars: 60}
  long:   {label: Investment,  min_days: 90, max_days: 600, time_stop_bars: 250}

# ---------------------------------------------------------------- universe filters
universe:
  psx:
    exclude_debt: true          # sukuk / TFCs are not equities
    exclude_etf: false
    min_price: 1.0              # PKR
    min_bars: 120
    # A stock must trade at least this much (PKR of value per day, 20 day median) to be recommended.
    min_adv_value: 5000000
  crypto:
    top_n: 500                  # by market cap
    min_24h_volume_usd: 2000000
    min_bars: 120
    exclude_stables: true
  fx:
    include_exotics: true
    include_pkr_crosses: true   # shown for information; flagged as not offered by most retail brokers
    include_metals: true
    min_bars: 200

# ---------------------------------------------------------------- signals
signals:
  min_bars: 200                 # bars of history needed before an instrument gets trade ideas
  enter_score: 0.30             # |composite| needed to open a trade (composite is in -1..+1)
  strong_score: 0.50
  cooldown_bars: {short: 4, medium: 12, long: 30}
  # Live conviction = calibrated technical conviction + tilt from data that cannot be backtested
  # (fundamentals, carry). Tilt is limited to this many conviction points either way.
  max_tilt_points: 12
  # An idea is only marked actionable when its modelled expected result (in R, net of costs) is above this.
  min_exp_r: 0.02
  # PSX has no practical retail short selling, so short signals on PSX are reported as "avoid".
  psx_allow_short: false
  # Factor weights per horizon. Factors missing for an instrument are dropped and the rest renormalised.
  weights:
    short:
      trend: 0.15
      momentum: 0.20
      reversion: 0.25
      structure: 0.20
      volume: 0.10
      pattern: 0.05
      rs: 0.05
    medium:
      trend: 0.35
      momentum: 0.25
      reversion: 0.00
      structure: 0.15
      volume: 0.10
      pattern: 0.00
      rs: 0.15
    long:
      trend: 0.40
      momentum: 0.35
      reversion: 0.00
      structure: 0.10
      volume: 0.00
      pattern: 0.00
      rs: 0.15
  # Regime adjustment added to the composite score (long +, short -) in the market's current regime.
  regime_tilt:
    bull: 0.05
    recovery: 0.03
    range: 0.0
    correction: -0.05
    bear: -0.10

# ---------------------------------------------------------------- trade plans
plan:
  short:
    stop_atr: 1.5               # stop distance in ATR(14) when no better structure level exists
    max_stop_atr: 3.0
    targets_r: [1.5, 2.5]       # target ladder in multiples of initial risk
    scale_out: [0.5, 0.5]       # fraction of the position closed at each target
    entry_wait_bars: 3          # how long a pullback limit order stays valid
  medium:
    stop_atr: 2.5
    max_stop_atr: 4.5
    targets_r: [2.0, 3.5]
    scale_out: [0.5, 0.5]
    entry_wait_bars: 5
  long:
    stop_atr: 4.0
    max_stop_atr: 7.0
    targets_r: [3.0, 6.0]
    scale_out: [0.4, 0.6]
    entry_wait_bars: 10
  min_rr: 1.5
  max_stop_pct:                 # a stop wider than this is not a plan you can size sensibly: the idea is shown but not actionable
    psx: 25.0
    fx: 8.0
    crypto: 40.0

# ---------------------------------------------------------------- trading costs (round trip, fraction of notional)
costs:
  psx: 0.0060                   # brokerage, CDC, SECP levy, taxes and slippage on both legs
  crypto: 0.0025
  fx:
    major: 0.00015
    minor: 0.0003
    exotic: 0.0008
    pkr: 0.003
    metal: 0.0004

# ---------------------------------------------------------------- backtest & calibration
backtest:
  oos_fraction: 0.4             # last share of each instrument's trades is reported as out of sample
  min_trades_reliable: 20
  calibration_min_trades: 200   # pooled trades needed before conviction is mapped to observed win rates
  shrink_k: 100                 # pseudo-trades of prior when blending an instrument's own results with the pool: one instrument's luck must not dominate
  max_history_bars: 1500
  # Whether a market and horizon may produce actionable ideas at all: its trades must beat random entries with the same exits.
  # Each trade is compared with the random entries (`baseline_lanes` independent streams of them per instrument) opened in the same
  # direction on its own day or in the next `match_days` days, so the market's moves cancel. The average difference must be above
  # zero with the one-sided p-value `edge_alpha`, the newer 40% of trades must agree, and the uncertainty allows for trades that
  # overlap in time (about the longest time a trade stays open) and for each instrument's own luck. A horizon whose trades last a
  # large part of the history (the one-year horizon, with 5 years of data) cannot be tested: `edge_min_spans` is how many
  # trade-lengths of history are needed.
  edge_alpha: 0.01
  edge_min_spans: 10
  edge_min_matched: 3           # random entries a trade needs around its day before it is compared with them
  baseline_lanes: 4
  match_days: {short: 7, medium: 14, long: 60}

# ---------------------------------------------------------------- fundamentals & valuation
valuation:
  risk_free_pkr: 0.11           # cost of capital anchor for PSX, refreshed from the policy rate when known
  equity_risk_premium: 0.06
  terminal_growth: 0.07         # nominal PKR long-run growth cap used in the dividend and P/B models
  fair_pe_default: 8.0          # fallback when a sector has too few peers to take a median
  margin_of_safety_buy: 0.20

# ---------------------------------------------------------------- bargains: PSX shares priced far below a conservative fair value
# Fair value here is the middle of three deliberately low yardsticks (see acumen/analysis/bargains.py), not the blend on a stock's page.
# Like every threshold in this file these are fixed rules, not fitted to data: nothing about fundamentals can be back-tested point in time.
bargains:
  tiers: [50, 35, 20]           # % below fair value. 50 means a price of at most half of fair value: "a dollar for fifty cents"
  watch_min_mos: 35             # a share at least this far below fair value that fails a check is shown, with its reasons
  growth: 0.03                  # long-run growth in the peer P/E cap and the justified P/B: below inflation, so no real growth
  max_roe_pct: 30               # the most return on equity the justified P/B credits, whatever the share earns today
  min_models: 3                 # yardsticks that must all be computable (earnings power, peer P/E, justified P/B)
  # checks that keep value traps out: failing any of them keeps a share off the list
  min_pe: 1.5                   # a lower P/E is nearly always a one-off gain or a data error
  min_pb: 0.15                  # a price below this share of book value is a data problem or a company in distress
  roe_outlier_pct: 60           # a higher return on equity is not believable as a lasting level
  max_eps_jump_pct: 300         # profit that quadrupled in a year is treated as a one-off
  min_mcap: 2000000000          # PKR market value
  min_free_float_pct: 10
  max_drop_1m_pct: 20           # a price that fell this much in a month, or max_drop_3m_pct in three, may know what the accounts do not
  max_drop_3m_pct: 35
  max_debt_to_equity: 2.5       # not applied to banks, insurers and other lenders; ignored when the feed has no debt figure
  max_price_gap: 0.25           # the price may differ this much from the price implied by the reported ratios, or from the last stored close
  max_stale_days: 7             # days since the share last traded
  # what a card tells you to expect
  horizon_months: [12, 36]      # a typical wait for the gap to close; an assumption, not a forecast
  review_drop_pct: 25           # re-read the accounts if the price falls this far below your purchase price
  max_position_pct: 5           # of equity in any one of these: the model can be wrong
  max_list: 25
  max_excluded: 20

# ---------------------------------------------------------------- portfolio profiles
portfolio:
  profiles:
    conservative: {risk_per_trade_pct: 0.5, max_heat_pct: 4.0, max_positions: 6,  min_grade: A, max_per_sector: 2, max_per_market_pct: 60}
    balanced:     {risk_per_trade_pct: 1.0, max_heat_pct: 6.0, max_positions: 8,  min_grade: B, max_per_sector: 2, max_per_market_pct: 60}
    aggressive:   {risk_per_trade_pct: 1.5, max_heat_pct: 10.0, max_positions: 10, min_grade: B, max_per_sector: 3, max_per_market_pct: 70}
  max_position_pct: 20          # of equity
  max_pct_of_adv: 10            # of the instrument's average daily traded value
  max_pair_correlation: 0.75
  var_confidence: 0.95

# ---------------------------------------------------------------- policy rates for the FX carry factor
# Manual inputs. Update them when central banks move. `as_of` is shown in the app and a stale table is flagged.
rates:
  as_of: "2025-12-15"
  policy_rate_pct:
    USD: 3.75
    EUR: 2.00
    GBP: 3.75
    JPY: 0.75
    CHF: 0.00
    AUD: 3.60
    NZD: 2.50
    CAD: 2.25
    SEK: 1.75
    NOK: 4.00
    PKR: 10.50
    INR: 5.25
    TRY: 38.00
    ZAR: 6.75
    MXN: 7.00
    BRL: 15.00
    SGD: 1.50
    CNH: 3.00
    AED: 3.75
    SAR: 4.50

# ---------------------------------------------------------------- data collection
data:
  contact_env: ACUMEN_CONTACT
  request_timeout_s: 30
  psx:
    sources: [dps, tradingview, yahoo]   # tried in this order for each kind of data
    history_years: 5
    ohlc_days: 400              # trading days of true high/low fetched day by day from the portal
    max_requests_per_run: 450   # backfill budget per run, the rest resumes next run
    min_interval_s: 1.2         # polite spacing between requests to the portal
  crypto:
    # Candle sources, tried in this order for each coin (a coin is only asked of venues that list it). KuCoin is last among the
    # exchanges because its daily candle boundary is the least documented; "coingecko" keeps closes-only history as a last resort.
    sources: [binance_vision, okx, coinbase, kraken, kucoin, coingecko]
    history_days: 1000          # completed days fetched the first time a coin is seen
    max_seconds: 1500           # stop requesting candles after this long; coins not reached keep their stored history
    coingecko_fallback_max: 40  # close-only histories fetched from CoinGecko per run (its free tier is rate limited)
    coingecko_key_env: COINGECKO_API_KEY   # optional free "demo" key: faster, steadier limits
  fx:
    # Tried in this order, each only for what the previous ones could not deliver: Yahoo (true highs and lows), the European
    # Central Bank's daily fixings via Frankfurter (close only, no metals or rupee), a daily-rates snapshot feed (bridges a few days).
    sources: [yahoo, frankfurter, fawaz]
    history_years: 5
    max_seconds: 900            # stop requesting after this long; pairs not reached keep their stored history
    fawaz_max_days: 10          # the snapshot feed is one request per missing day: only used to bridge a gap this short
  macro:
    fred_series: [FEDFUNDS, DGS2, T10Y2Y]   # the 10-year yield (DGS10) is always read too, as the fallback for Yahoo's ^TNX
    yahoo_symbols: {DXY: "DX-Y.NYB", US10Y: "^TNX", GOLD: "GC=F", BRENT: "BZ=F", SPX: "^GSPC", VIX: "^VIX", MSCI_EM: "EEM"}
    # An IMF-reported policy-rate series on FRED. Optional: it is only used when its newest reading is more recent than the
    # table in the "rates" section below. Set to "" to rely on the table alone.
    pk_policy_fred: INTDSRPKM193N

# ---------------------------------------------------------------- output
output:
  bars_in_detail: 320           # daily bars shipped to the app per instrument
  encrypt: auto                 # auto = encrypt when the passphrase variable is set; true = require it; false = never encrypt
  passphrase_env: ACUMEN_PASSPHRASE   # the environment variable (a repository secret in the workflow) that holds the passphrase
  top_ideas_per_horizon: 40
  ledger_keep_days: 400

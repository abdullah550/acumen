<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0e15" media="(prefers-color-scheme: dark)">
<meta name="description" content="Acumen: market intelligence for the PSX, forex and crypto with trade plans, targets and timelines.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Acumen">
<title>Acumen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
// Apply saved appearance before first paint to avoid a flash.
try {
  var s = JSON.parse(localStorage.getItem('acumen.v1') || '{}'), r = document.documentElement;
  if (s.theme === 'light' || s.theme === 'dark') r.setAttribute('data-theme', s.theme);
  if (s.palette === 'cb') r.setAttribute('data-palette', 'cb');
  if (s.density === 'compact') r.setAttribute('data-density', 'compact');
} catch (e) {}
</script>
<link rel="stylesheet" href="app.css?v=e2588e6a40">
</head>
<body>
<div id="app"></div>
<noscript><p style="font:16px system-ui;padding:24px">Acumen needs JavaScript to run.</p></noscript>
<script src="app.js?v=e2588e6a40" defer></script>
</body>
</html>

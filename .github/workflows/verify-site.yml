# Temporary: looks at the published site the way a visitor does (a real browser on a GitHub server) and keeps what it saw on the
# `report-verify` branch (verify.txt and screenshots). Also removes the finished probe branch. Deleted once the answer is used.
name: Check the live site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/verify_site.mjs"
      - ".github/workflows/verify-site.yml"

permissions:
  contents: write

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a browser
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium 2>&1 | tail -2
      - name: Look at the site
        shell: bash
        env:
          WANT_BUILD: "4b7f5cdff2"
        run: node scripts/verify_site.mjs 2>&1 | tee verify.txt
      - name: Keep what it saw, and remove the finished probe branch
        if: always()
        shell: bash
        run: |
          set -eu
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          header="$(git config --local --get http.https://github.com/.extraheader || true)"
          auth=(); if [ -n "$header" ]; then auth=(-c "http.https://github.com/.extraheader=${header}"); fi
          git ${auth[@]+"${auth[@]}"} push "$remote" --delete report-probe || echo "report-probe is already gone"
          work="$(mktemp -d)"
          cp verify.txt "$work"/ 2>/dev/null || true
          cp shots/*.png "$work"/ 2>/dev/null || true
          cd "$work"
          git init -q -b report-verify
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "verify $(date -u +%Y-%m-%dT%H:%MZ)"
          git ${auth[@]+"${auth[@]}"} push --force "$remote" report-verify:refs/heads/report-verify

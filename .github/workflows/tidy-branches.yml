# Temporary: removes the finished temporary report branches. Deleted right after it has run.
name: Remove temporary branches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tidy-branches.yml"

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Delete the branches
        shell: bash
        run: |
          for b in report-probe report-verify; do
            git push origin --delete "$b" || echo "$b: already gone or could not be deleted"
          done
          git ls-remote --heads origin

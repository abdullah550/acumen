# Asks every data source a small question and reports which ones still answer and still look the way Acumen expects.
# Run it by hand after setting up (Actions > Check data sources > Run workflow). It also runs weekly, and whenever the code that
# talks to the sources changes. The latest report is kept on the `report-doctor` branch (file doctor.txt), so it can be read
# without opening the run.
name: Check data sources

on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 1"   # Mondays, 05:43 UTC
  push:
    branches: [main]
    paths:
      - "acumen/fetch/**"
      - ".github/workflows/doctor.yml"

permissions:
  contents: write   # only to replace the single commit on the `report-doctor` branch

concurrency:
  group: acumen-doctor
  cancel-in-progress: true

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      ACUMEN_CONTACT: ${{ vars.ACUMEN_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Check every source
        shell: bash   # bash runs with pipefail, so `tee` cannot hide a failing check: a market with no working source fails the job
        run: python -m acumen doctor | tee doctor.txt
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-report
          path: doctor.txt
      - name: Keep the report on the report-doctor branch
        if: always()
        run: bash scripts/keep_report.sh report-doctor doctor.txt

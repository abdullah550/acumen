# Temporary: one question about the PSX data portal, answered from GitHub's servers. Deleted once the answer is used.
name: Probe PSX portal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_psx.py"
      - ".github/workflows/probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ask
        shell: bash
        run: python3 scripts/probe_psx.py 2>&1 | tee probe.txt
      - name: Keep the answer
        if: always()
        run: bash scripts/keep_report.sh report-probe probe.txt

# Temporary: which sources give live prices from GitHub's servers. Deleted once the answer is used.
name: Probe live price sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_live.mjs"
      - "web/src/lib/livecore.js"
      - ".github/workflows/probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ask
        shell: bash
        run: node scripts/probe_live.mjs 2>&1 | tee probe.txt
      - name: Keep the answer
        if: always()
        run: bash scripts/keep_report.sh report-probe probe.txt

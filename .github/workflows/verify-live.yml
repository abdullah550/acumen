# Temporary: looks at the deployed site the way a visitor does and writes what it found to a short-lived branch. Deleted right after it has run.
name: Verify live site (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a browser driver (the runner already has Chrome)
        run: npm install --prefix "$RUNNER_TEMP/pw" playwright-core@1.49.1 --no-audit --no-fund --loglevel=error
      - name: Look at the live site
        shell: bash
        env:
          PW: ${{ runner.temp }}/pw
        run: |
          cat > "$RUNNER_TEMP/verify.mjs" <<'JS'
          import { createRequire } from 'node:module';
          import fs from 'node:fs';
          const require = createRequire(process.env.PW + '/');
          const { chromium } = require('playwright-core');
          const BASE = 'https://abdullah550.github.io/acumen/';
          const out = [];
          const say = (k, v) => { const line = `${k}: ${typeof v === 'string' ? v : JSON.stringify(v)}`; out.push(line); console.log(line); };
          const get = async p => { const r = await fetch(BASE + p + '?t=' + Date.now(), { cache: 'no-store' }); return { status: r.status, text: await r.text() }; };
          try {
            const m = await get('data/meta.json');
            say('meta.status', m.status);
            const meta = JSON.parse(m.text);
            say('meta.generated_at', meta.generated_at); say('meta.enc', meta.enc === null ? 'null (plain, public)' : 'sealed'); say('meta.files.flows', meta.files && meta.files.flows);
            const ext = meta.ext || 'json';
            if (meta.enc === null) {
              const f = JSON.parse((await get('data/' + meta.files.flows)).text);
              say('flows.ready', f.ready); say('flows.asof', f.asof); say('flows.counts', f.counts);
              say('flows.backtest', { verdict: f.backtest && f.backtest.verdict, anchors: f.backtest && f.backtest.anchors, tests: f.backtest && f.backtest.tests && f.backtest.tests.length });
              say('flows.weeks', (f.weeks || []).map(w => w.week)); say('flows.live', f.live && { weeks: f.live.weeks, horizons: f.live.horizons });
              say('flows.report.lines', (f.report && f.report.lines || []).length); say('flows.macro', f.macro);
              say('flows.entering', (f.report || {}).entering); say('flows.leaving', (f.report || {}).leaving);
              const b = JSON.parse((await get('data/' + meta.files.bargains)).text);
              say('bargains.record', b.record && { counts: b.record.counts, verdict: b.record.verdict, asof: b.record.asof, rows: (b.record.rows || []).length });
              const ov = JSON.parse((await get('data/' + meta.files.overview)).text);
              say('overview.flows', ov.flows);
            }
            const js = await get('app.js');
            say('app.js', { status: js.status, hasMoneyFlows: js.text.includes('Money Flows'), bytes: js.text.length });
            const idx = await get('index.html');
            say('index.status', idx.status);
            const browser = await chromium.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox'] });
            for (const [name, vp] of [['desktop', { width: 1366, height: 900 }], ['phone', { width: 390, height: 844 }]]) {
              const ctx = await browser.newContext({ viewport: vp, serviceWorkers: 'block' });
              const page = await ctx.newPage();
              const errs = [];
              page.on('pageerror', e => errs.push('pageerror: ' + e.message));
              page.on('console', c => { if (c.type() === 'error') errs.push('console: ' + c.text().slice(0, 160)); });
              await page.goto(BASE + '#/flows', { waitUntil: 'networkidle', timeout: 60000 });
              try { await page.waitForSelector('.fl-page', { timeout: 20000 }); } catch (e) { say(name + '.fl-page', 'NOT FOUND: ' + (await page.locator('body').innerText()).slice(0, 300).replace(/\n/g, ' | ')); }
              const facts = await page.evaluate(() => {
                const q = s => document.querySelectorAll(s).length;
                const vis = s => [...document.querySelectorAll(s)].filter(e => e.offsetParent !== null).length;
                return {
                  page: !!document.querySelector('.fl-page'), title: (document.querySelector('h1') || {}).textContent,
                  verdict: ((document.querySelector('.fl-page .banner') || {}).textContent || '').slice(0, 140),
                  answerRows: q('.fl-row'), sectorTableRows: vis('.fl-tbl tbody tr'), candidateCards: vis('.ev-crow'), stateChips: q('.chip'),
                  scrollW: document.documentElement.scrollWidth, clientW: document.documentElement.clientWidth,
                  tablesWiderThanScreen: [...document.querySelectorAll('.tbl-wrap.ev-wide')].filter(w => w.offsetParent !== null && w.scrollWidth > w.clientWidth + 2).length,
                };
              });
              say(name + '.flows', facts); say(name + '.errors', errs);
              await page.goto(BASE + '#/', { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForTimeout(1500);
              say(name + '.homeTile', await page.locator('.card', { hasText: 'Money Flows' }).count());
              await ctx.close();
            }
            await browser.close();
          } catch (e) { say('FAILED', String(e && e.stack || e).slice(0, 600)); }
          fs.writeFileSync('verify-report.txt', out.join('\n') + '\n');
          JS
          node "$RUNNER_TEMP/verify.mjs"
      - name: Save the report on a short-lived branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan report-verify
          git rm -rf --quiet . || true
          git add -f verify-report.txt
          git commit -q -m "Live site check"
          git push -f origin report-verify
